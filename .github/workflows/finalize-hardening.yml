name: Finalize hardening fixes

on:
  push:
    branches:
      - fix/v0.48.0-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[hardening-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/events.rs')
          text = p.read_text()
          assert text.count('''let candidates: Vec<&EventContent> = content''') == 1
          text = text.replace('''let candidates: Vec<&EventContent> = content''', '''let candidates: Vec<&EventContent> = events''', 1)
          p.write_text(text)

          p = Path('src/content/loader.rs')
          text = p.read_text()
          old = '''        let valid = ModManifest {\n            id: "test".into(),\n            name: "Test".into(),\n            enabled: true,\n            priority: 0,\n            content_file: "nested/content.json".into(),\n        };'''
          new = '''        let valid = ModManifest {\n            id: "test".into(),\n            name: "Test".into(),\n            version: "1.0.0".into(),\n            enabled: true,\n            priority: 0,\n            content_file: "nested/content.json".into(),\n        };'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))

          p = Path('src/persistence.rs')
          text = p.read_text()
          old = '''        assert_eq!(loaded.world.event_cooldowns, state.world.event_cooldowns);'''
          new = '''        assert_eq!(loaded.world.event_cooldowns, state.world.event_cooldowns);\n        assert_eq!(loaded.rng_state, state.rng_state);'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))

          # Update the current v0.48 roadmap without claiming the later procedural milestones.
          p = Path('ROADMAP.md')
          text = p.read_text()
          marker = '''- authored/generated relationship integration is deterministic and idempotent\n'''
          addition = '''- authored/generated relationship integration is deterministic and idempotent\n- gameplay hardening covers negative Insight XP, persistent deterministic event RNG, bounded history, save serialization/decompression limits, and mod path confinement\n'''
          if marker in text and addition not in text:
              text = text.replace(marker, addition, 1)
          p.write_text(text)

          Path('.github/workflows/finalize-hardening.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo fmt --all
          git add --all
          git commit -m "[hardening-final] finalize reliability and security coverage"
          git push origin HEAD:fix/v0.48.0-hardening
