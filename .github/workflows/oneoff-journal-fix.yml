name: One-off v0.39 journal whitespace fix

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Preserve journal art whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ui.rs')
          text = path.read_text()
          start = text.index('fn render_log')
          end = text.index('fn render_footer', start)
          function = text[start:end]
          old = '.wrap(Wrap { trim: true });'
          if function.count(old) != 1:
              raise SystemExit(f'expected 1 render_log wrap, found {function.count(old)}')
          function = function.replace(old, '.wrap(Wrap { trim: false });', 1)
          text = text[:start] + function + text[end:]
          path.write_text(text)
          PY

      - name: Clean temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/oneoff-fix-trigger .github/workflows/oneoff-journal-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui.rs .github/oneoff-fix-trigger .github/workflows/oneoff-journal-fix.yml
          git commit -m 'fix: preserve journal art whitespace'
          git push origin HEAD:dev
