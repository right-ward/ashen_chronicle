name: Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        type: string
      target:
        description: Android architecture to build
        required: true
        type: choice
        options:
          - android-x86_64
          - android-aarch64
          - android-armv7

concurrency:
  group: android-${{ github.ref }}-${{ inputs.branch }}-${{ inputs.target }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Android build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ref: ${{ steps.version.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tags must use vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE 'origin/main$'; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

          package_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d\" -f2)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($package_version) does not match tag ($tag_version)."
            exit 1
          fi

      - name: Resolve build version
        id: version
        shell: bash
        env:
          DISPATCH_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            ref_name="$GITHUB_REF_NAME"
            version="${ref_name#v}"
            ref="$GITHUB_REF_NAME"
          else
            ref="$DISPATCH_BRANCH"
            version="$(git show "origin/$DISPATCH_BRANCH":Cargo.toml | grep '^version = ' | head -n 1 | cut -d\" -f2)"
            if [[ -z "$version" ]]; then
              echo "Could not resolve Cargo.toml version from branch $DISPATCH_BRANCH."
              exit 1
            fi
          fi

          IFS=. read -r major minor patch <<< "$version"
          version_code=$((minor * 100000 + patch * 1000 + 1))

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Prepare matrix
        id: matrix
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          matrix='[
            {"target":"x86_64-linux-android","dispatch_target":"android-x86_64","arch":"x86_64","abi":"x86_64"},
            {"target":"aarch64-linux-android","dispatch_target":"android-aarch64","arch":"aarch64","abi":"arm64-v8a"},
            {"target":"armv7-linux-androideabi","dispatch_target":"android-armv7","arch":"armv7","abi":"armeabi-v7a"}
          ]'

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            matrix="$(jq -c --arg target "$TARGET" 'map(select(.dispatch_target == $target))' <<< "$matrix")"
            if [[ "$matrix" == "[]" ]]; then
              echo "Unsupported Android target: $TARGET"
              exit 1
            fi
          fi

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Android ${{ matrix.arch }} APK
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Generate third-party licenses
        uses: ./.github/actions/third-party-licenses

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.6'
          cache-overwrite-existing: true

      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "Android release signing secrets are not configured."
              echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
              exit 1
            fi

            keystore_file="$RUNNER_TEMP/ashen-chronicle-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          else
            if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
              keystore_file="$RUNNER_TEMP/ashen-chronicle-release.keystore"
              printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
            else
              keystore_file="$RUNNER_TEMP/ashen-chronicle-ci.keystore"
              store_password="$(openssl rand -hex 24)"
              key_password="$(openssl rand -hex 24)"
              key_alias="ashen-chronicle-ci"
              keytool -genkeypair -noprompt \
                -keystore "$keystore_file" \
                -storepass "$store_password" \
                -keypass "$key_password" \
                -alias "$key_alias" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 1 \
                -dname "CN=The Ashen Chronicle CI,O=Right Ward,C=XX"

              echo "ANDROID_KEYSTORE_PASSWORD=$store_password" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
              echo "ANDROID_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"
            fi
          fi

          echo "ANDROID_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"
          if [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"; fi
          if [[ -n "$ANDROID_KEY_ALIAS" ]]; then echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"; fi
          if [[ -n "$ANDROID_KEY_PASSWORD" ]]; then echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"; fi

      - name: Build native Android library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          : > android-build.log

          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          case "$TARGET" in
            x86_64-linux-android)
              linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
              ;;
            aarch64-linux-android)
              linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
              ;;
            armv7-linux-androideabi)
              linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
              export CC_armv7_linux_androideabi="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
              export CXX_armv7_linux_androideabi="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang++"
              ;;
            *)
              echo "Unsupported Android target: $TARGET"
              exit 1
              ;;
          esac

          target_env="${TARGET//-/_}"
          target_env="${target_env^^}"
          export "CARGO_TARGET_${target_env}_LINKER=$linker"

          rustup target add "$TARGET" 2>&1 | tee -a android-build.log
          cargo build --release --target "$TARGET" 2>&1 | tee -a android-build.log

          so_file="target/$TARGET/release/libashen_chronicle.so"
          if [[ ! -s "$so_file" ]]; then
            echo "Android native library was not produced: $so_file"
            exit 1
          fi

          llvm_nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "=== llvm-nm -D (raw, unfiltered) ==="
          "$llvm_nm" -D "$so_file" || true

          echo "=== llvm-nm -D android_main search ==="
          "$llvm_nm" -D "$so_file" | grep -i android_main || echo "NO MATCH in -D output"

          echo "=== llvm-readelf -Ws android_main search ==="
          "$readelf_bin" -Ws "$so_file" | grep -i android_main || echo "NO MATCH in readelf -Ws"

          echo "=== existing android_main export gate ==="
          if ! "$llvm_nm" -D "$so_file" | grep -qE ' [Tt] android_main$'; then
            echo "libashen_chronicle.so does not export android_main; GameActivity cannot start it."
            exit 1
          fi

          mkdir -p "android/app/src/main/jniLibs/${{ matrix.abi }}"
          cp "$so_file" "android/app/src/main/jniLibs/${{ matrix.abi }}/libashen_chronicle.so"

      - name: Stage legal notices as APK assets
        shell: bash
        run: |
          set -euo pipefail
          legal_dir="android/app/src/main/assets/legal"
          mkdir -p "$legal_dir"
          cp LICENSE LICENSE-CONTENT NOTICE THIRD-PARTY-NOTICES TRADEMARKS.md \
            THIRD-PARTY-LICENSES.txt legal/ANDROID-DEPENDENCIES.txt "$legal_dir/"
          cp LICENSES/Apache-2.0.txt "$legal_dir/"
          ls -l "$legal_dir"

      - name: Build signed APK
        shell: bash
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee ../android-build.log

          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Expected APK not found: $apk"
            exit 1
          fi

          safe_ref="${{ needs.prepare.outputs.ref }}"
          safe_ref="${safe_ref//\//-}"
          apk_name="ashen_chronicle-${safe_ref}-android-${{ matrix.arch }}.apk"
          cp "$apk" "../$apk_name"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"
          echo "Created $apk_name" | tee -a ../android-build.log

      - name: Verify APK signature
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose "../$APK_NAME"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 7
          archive: false
          overwrite: true

      - name: Archive Android build log
        if: always()
        shell: bash
        run: |
          set +e
          {
            printf '%s\n' \
              "platform=android" \
              "arch=${{ matrix.arch }}" \
              "abi=${{ matrix.abi }}" \
              "target=${{ matrix.target }}" \
              "ref=${{ needs.prepare.outputs.ref }}" \
              "version=${{ needs.prepare.outputs.version }}"
            cat android-build.log 2>/dev/null || true
          } > android-build-${{ matrix.arch }}.txt
          tar caf android-build-log-${{ matrix.arch }}.tar.xz android-build-${{ matrix.arch }}.txt

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          path: android-build-log-${{ matrix.arch }}.tar.xz
          if-no-files-found: error
          retention-days: 7
          archive: false
          overwrite: true

  publish:
    name: Publish Android APKs
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ashen_chronicle-*-android-*.apk
          path: dist
          merge-multiple: true

      - name: Publish APKs and remove legacy Android archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist/*.apk --clobber
              break
            fi
            echo "Release $TAG_NAME is not available yet; retrying ($attempt/60)."
            sleep 5
          done

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Timed out waiting for GitHub Release $TAG_NAME."
            exit 1
          fi

          for asset in \
            "ashen_chronicle-${TAG_NAME}-android-x86_64.tar.xz" \
            "ashen_chronicle-${TAG_NAME}-android-aarch64.tar.xz" \
            "ashen_chronicle-${TAG_NAME}-android-armv7.tar.xz"; do
            gh release delete-asset "$TAG_NAME" "$asset" --yes || true
          done
