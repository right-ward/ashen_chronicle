name: One-off UI style repair

on:
  push:
    branches:
      - feat/v0.44.0-combat-screen
    paths:
      - .github/workflows/one-off-ui-style-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix: restore main UI text styling') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.44.0-combat-screen
          fetch-depth: 0

      - name: Restore main UI border/text styling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ui.rs')
          text = path.read_text()
          old = '''fn border_style(compact: bool) {
              if compact {
                  Style::default().add_modifier(Modifier::DIM)
              } else {
                  Style::default()
              }
          }'''
          new = '''fn border_style(compact: bool) -> Style {
              if compact {
                  Style::default().fg(Color::Gray)
              } else {
                  Style::default()
                      .fg(Color::White)
                      .add_modifier(Modifier::BOLD)
              }
          }'''

          current = '''fn border_style(compact: bool) -> Style {
              if compact {
                  Style::default().add_modifier(Modifier::DIM)
              } else {
                  Style::default()
              }
          }'''
          if current not in text:
              raise SystemExit('Expected regressed border_style helper was not found')
          path.write_text(text.replace(current, new, 1))
          PY

      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui.rs .github/workflows/one-off-ui-style-fix.yml
          git rm .github/workflows/one-off-ui-style-fix.yml
          git commit -m 'fix: restore main UI text styling'
          git push origin feat/v0.44.0-combat-screen