name: One-off v0.39 UI fixes

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ui.rs')
          text = path.read_text()

          old_menu = '.alignment(ratatui::layout::Alignment::Center)\n        .wrap(Wrap { trim: true });'
          new_menu = '.alignment(ratatui::layout::Alignment::Center)\n        .wrap(Wrap { trim: false });'
          if text.count(old_menu) != 1:
              raise SystemExit(f'expected 1 menu wrap, found {text.count(old_menu)}')
          text = text.replace(old_menu, new_menu, 1)

          start = text.index('fn render_panel')
          end = text.index('fn render_log', start)
          function = text[start:end]
          old_wrap = '.wrap(Wrap { trim: true });'
          if function.count(old_wrap) != 1:
              raise SystemExit(f'expected 1 render_panel wrap, found {function.count(old_wrap)}')
          function = function.replace(old_wrap, '.wrap(Wrap { trim: false });', 1)
          text = text[:start] + function + text[end:]

          path.write_text(text)
          PY

      - name: Make console and menu rendering opaque
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/game/console_ui.rs')
          text = path.read_text()

          old_menu = '''        terminal.draw(|frame| {\n            let popup = centered_rect(64, 70, frame.area());'''
          new_menu = '''        terminal.draw(|frame| {\n            frame.render_widget(Clear, frame.area());\n            let popup = centered_rect(64, 70, frame.area());'''
          if text.count(old_menu) != 1:
              raise SystemExit(f'expected 1 console menu draw, found {text.count(old_menu)}')
          text = text.replace(old_menu, new_menu, 1)

          old_console = '''    terminal.draw(|frame| {\n        let area = centered_rect(92, 82, frame.area());'''
          new_console = '''    terminal.draw(|frame| {\n        frame.render_widget(Clear, frame.area());\n        let area = centered_rect(92, 82, frame.area());'''
          if text.count(old_console) != 1:
              raise SystemExit(f'expected 1 console draw, found {text.count(old_console)}')
          text = text.replace(old_console, new_console, 1)

          path.write_text(text)
          PY

      - name: Commit fixes and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui.rs src/game/console_ui.rs .github/workflows/oneoff-fix.yml
          git commit -m 'fix: preserve art whitespace and clear UI frames'
          git push origin HEAD:dev
