name: Apply combat terminal fix

on:
  push:
    branches:
      - feat/v0.44.0-combat-screen

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path("src/ui.rs")
          text = ui.read_text()
          marker = "pub(crate) fn read_key() -> io::Result<KeyCode> {\n    read_key_event()\n}\n"
          helper = marker + "\npub(crate) fn draw_combat_screen<F>(draw: F) -> io::Result<()>\nwhere\n    F: FnOnce(&mut ratatui::Frame<'_>, Rect),\n{\n    let mut state = runtime().lock().unwrap();\n    let Some(terminal) = state.terminal.as_mut() else {\n        return Ok(());\n    };\n    terminal.draw(|frame| {\n        let area = frame.area();\n        frame.render_widget(Clear, area);\n        draw(frame, area);\n    })?;\n    terminal.hide_cursor()?;\n    Ok(())\n}\n"
          if "pub(crate) fn draw_combat_screen" not in text:
              if marker not in text:
                  raise SystemExit("ui.rs insertion marker not found")
              text = text.replace(marker, helper, 1)
              ui.write_text(text)

          combat = Path("src/game/combat.rs")
          text = combat.read_text()
          text = text.replace("            legacy::notify_item_gain(state, &trophy);\n", "", 1)
          if "let result_note = format!(" not in text:
              marker = "            events.push(\"Victory\".to_string());\n"
              result_block = "            let result_note = format!(\n                \"Loot: {}\\n{}\\n\\nThe threat is broken. The place is quieter now.\",\n                trophy.name, trophy.description\n            );\n" + marker
              if marker not in text:
                  raise SystemExit("victory marker not found")
              text = text.replace(marker, result_block, 1)
              text = text.replace("                \"The threat is broken. The place is quieter now.\",\n", "                &result_note,\n", 1)
              combat.write_text(text)

          screen = Path("src/game/combat_screen.rs")
          text = screen.read_text()
          text = text.replace("use crossterm::cursor;\nuse crossterm::execute;\nuse crossterm::terminal;\n", "use crossterm::terminal;\n")
          text = text.replace("use ratatui::widgets::{Block, Borders, Clear, LineGauge, Paragraph, Wrap};\nuse ratatui::Terminal;\n", "use ratatui::widgets::{Block, LineGauge, Paragraph, Wrap};\n")
          start = text.index("fn render(")
          end = text.index("\n#[allow(clippy::too_many_arguments)]\nfn render_actor", start)
          new_render = '''fn render(\n    player_name: &str,\n    player_hp: i32,\n    player_max_hp: i32,\n    player_condition: Option<&str>,\n    enemy_name: &str,\n    enemy_hp: i32,\n    enemy_max_hp: i32,\n    enemy_power: i32,\n    location_name: &str,\n    turn: u32,\n    events: &[String],\n    selected_action: Option<usize>,\n    result: Option<(&str, &str)>,\n) -> io::Result<()> {\n    crate::ui::draw_combat_screen(|frame, area| {\n        let margin = if area.width <= 112 || area.height <= 36 { 1 } else { 2 };\n        let outer = Rect {\n            x: area.x.saturating_add(margin),\n            y: area.y.saturating_add(margin),\n            width: area.width.saturating_sub(margin.saturating_mul(2)),\n            height: area.height.saturating_sub(margin.saturating_mul(2)),\n        };\n        if outer.width < 4 || outer.height < 8 {\n            return;\n        }\n\n        let root = Layout::default()\n            .direction(Direction::Vertical)\n            .constraints([\n                Constraint::Percentage(42),\n                Constraint::Percentage(34),\n                Constraint::Percentage(24),\n            ])\n            .spacing(Spacing::Overlap(1))\n            .split(outer);\n\n        let actors = Layout::default()\n            .direction(Direction::Horizontal)\n            .constraints([Constraint::Percentage(50), Constraint::Percentage(50)])\n            .spacing(Spacing::Overlap(1))\n            .split(root[0]);\n\n        render_actor(\n            frame,\n            actors[0],\n            "Player",\n            player_name,\n            player_hp,\n            player_max_hp,\n            player_condition,\n            Color::Red,\n        );\n        render_actor(\n            frame,\n            actors[1],\n            "Enemy",\n            enemy_name,\n            enemy_hp,\n            enemy_max_hp,\n            Some(&format!("Power: {enemy_power}")),\n            Color::Magenta,\n        );\n\n        let event_title = format!("Events — {location_name} — Turn {turn}");\n        let visible = root[1].height.saturating_sub(2) as usize;\n        let lines = if events.is_empty() {\n            vec!["The encounter begins.".to_string()]\n        } else {\n            events\n                .iter()\n                .rev()\n                .take(visible.max(1))\n                .cloned()\n                .collect::<Vec<_>>()\n                .into_iter()\n                .rev()\n                .collect()\n        };\n        frame.render_widget(\n            Paragraph::new(lines.join("\\n"))\n                .block(\n                    Block::default()\n                        .borders(ratatui::widgets::Borders::ALL)\n                        .title(event_title)\n                        .merge_borders(MergeStrategy::Exact),\n                )\n                .wrap(Wrap { trim: false }),\n            root[1],\n        );\n\n        let action_lines = if let Some((title, note)) = result {\n            vec![\n                title.to_string(),\n                String::new(),\n                note.to_string(),\n                String::new(),\n                "Press any key to continue...".to_string(),\n            ]\n        } else {\n            ACTIONS\n                .iter()\n                .enumerate()\n                .map(|(index, action)| {\n                    let marker = if selected_action == Some(index) { '▶' } else { ' ' };\n                    format!("{marker} {}. {action}", index + 1)\n                })\n                .chain([String::new(), "↑ ↓ / j k  Enter: choose".to_string()])\n                .collect()\n        };\n        frame.render_widget(\n            Paragraph::new(action_lines.join("\\n"))\n                .block(\n                    Block::default()\n                        .borders(ratatui::widgets::Borders::ALL)\n                        .title(if result.is_some() { "Result" } else { "Actions" })\n                        .merge_borders(MergeStrategy::Exact),\n                )\n                .wrap(Wrap { trim: true }),\n            root[2],\n        );\n    })\n}\n'''
          text = text[:start] + new_render + text[end:]
          screen.write_text(text)
          PY
          cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git add src/ui.rs src/game/combat.rs src/game/combat_screen.rs
          if git diff --cached --quiet; then
            echo "No source changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: share UI terminal with combat screen"
          git push origin HEAD:feat/v0.44.0-combat-screen
