name: Align hardening release version

on:
  push:
    branches:
      - fix/v0.48.0-hardening

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[version-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align patch version with released baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('Cargo.toml', 'Cargo.lock'):
              p = Path(name)
              text = p.read_text()
              assert '0.48.1' in text
              p.write_text(text.replace('0.48.1', '0.47.1'))
          Path('.github/workflows/fix-version.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "[version-final] align hardening patch version"
          git push origin HEAD:fix/v0.48.0-hardening
