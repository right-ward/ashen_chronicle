name: Development patch
on:
  push:
    branches:
      - feat/v0.50.4-storage-screen-audit
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def r(p,a,b):
            q=Path(p); s=q.read_text(); assert s.count(a)==1, (p,s.count(a)); q.write_text(s.replace(a,b,1))
          r('Cargo.toml','version = "0.50.4"','version = "0.50.5"')
          r('Cargo.toml','dirs = "6"\n','dirs = "6"\n\n[target.\'cfg(not(target_os = "android"))\'.dependencies]\nrfd = "0.17.2"\n')
          r('src/game_paths.rs','use std::path::{Path, PathBuf};\n','use std::path::{Path, PathBuf};\n\n#[cfg(not(target_os = "android"))]\nuse crate::desktop_storage;\n')
          r('src/game_paths.rs','        let (preferred_root, fallback_root) = platform_roots();\n','        let (preferred_root, fallback_root) = platform_roots();\n\n        #[cfg(not(target_os = "android"))]\n        let preferred_root = desktop_storage::resolve_root(&preferred_root)?;\n')
          r('src/game_paths.rs','            fs::copy(&bundled_base, self.base_content_path())?;\n            set_read_only(&self.base_content_path())?;','            let target = self.base_content_path();\n            if target.is_file() {\n                set_writable(&target)?;\n            }\n            fs::copy(&bundled_base, &target)?;\n            set_read_only(&target)?;')
          r('src/game_paths.rs','fn set_read_only(path: &Path) -> io::Result<()> {','fn set_writable(path: &Path) -> io::Result<()> {\n    let mut permissions = fs::metadata(path)?.permissions();\n    permissions.set_readonly(false);\n    fs::set_permissions(path, permissions)\n}\n\nfn set_read_only(path: &Path) -> io::Result<()> {')
          r('src/bevy_lifecycle.rs','LifecyclePhase::Load => lifecycle.save_files.len().saturating_sub(1),','LifecyclePhase::Load => lifecycle.save_files.len(),')
          r('src/bevy_combat.rs','            InputEvent::Cancel => {}','            InputEvent::Cancel => {\n                combat_state.clear();\n                navigation.return_screen = None;\n                navigation.current_screen = Some(ScreenId::Gameplay);\n                navigation.selected = 0;\n            }')
          p=Path('ROADMAP.md'); s=p.read_text(); marker='### v0.50.x: Android touch, soft-keyboard, and system Back input\n'; block='### v0.50.5: Cross-platform game-root selection and Android screen audit\n- Added native desktop game-root use/recreate/alternate-folder selection.\n- Hardened protected base-content replacement and corrected lifecycle Load Back navigation.\n- Corrected Combat semantic Cancel for Android system Back and audited all existing Bevy screens against the shared responsive/touch architecture.\n\n'; assert marker in s; p.write_text(s.replace(marker,block+marker.replace('v0.50.x:','v0.50.4:'),1))
          p=Path('docs/roadmap-history.md'); s=p.read_text(); marker='## v0.50.x: Android Packaging/Porting\n'; entry='### v0.50.5: Cross-platform game-root selection and Android screen audit\n- Added native desktop game-root use/recreate/alternate-folder selection.\n- Hardened protected base-content replacement and corrected lifecycle Load Back navigation.\n- Corrected Combat semantic Cancel for Android system Back and audited all existing Bevy screens against the shared responsive/touch architecture.\n'; assert marker in s; p.write_text(s.replace(marker,marker+entry,1))
          PY
          cargo fetch
          cargo fmt --all
          cargo fmt --all -- --check
          rm .github/workflows/dev-patch.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(v0.50.5): finish game-root flow and audit Bevy screens'
          git push origin HEAD:feat/v0.50.4-storage-screen-audit
