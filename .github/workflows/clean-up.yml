name: Cleanup CI/CD runs

on:
  workflow_run:
    workflows:
      - CI/CD
    types:
      - completed

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete previous CI/CD runs
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Delete previous CI/CD runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          workflow_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows" \
              --paginate \
              --jq '.workflows[] | select(.name == "CI/CD") | .id' |
            head -n 1
          )"

          if [[ -z "$workflow_id" ]]; then
            echo "Could not find the CI/CD workflow."
            exit 1
          fi

          echo "CI/CD workflow ID: $workflow_id"
          echo "Current successful release run: $CURRENT_RUN_ID"

          gh api \
            --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
            --jq '.workflow_runs[].id' > runs.txt

          deleted=0

          while read -r run_id; do
            [[ -z "$run_id" ]] && continue
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue

            echo "Deleting workflow run $run_id..."
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

            ((deleted += 1))
          done < runs.txt

          echo "Deleted $deleted previous CI/CD workflow runs."

