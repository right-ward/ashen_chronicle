name: PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.rs'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'data/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format PR
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.format.outputs.changed }}
      commit_sha: ${{ steps.format.outputs.commit_sha }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Format source
        id: format
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          ORIGINAL_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          cargo fmt --all

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$ORIGINAL_SHA" >> "$GITHUB_OUTPUT"
            echo "Formatting is already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply rustfmt"
          git push origin "HEAD:$HEAD_BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run Clippy
        shell: bash
        run: |
          set +e

          : > clippy.log
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
          clippy_status=${PIPESTATUS[0]}

          echo "clippy_status=$clippy_status" >> clippy.log
          if [ "$clippy_status" -ne 0 ]; then
            exit 1
          fi

      - name: Archive Clippy log
        if: always()
        shell: bash
        run: |
          set +e
          tar caf clippy-log.tar.xz clippy.log

      - name: Upload Clippy log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          path: clippy-log.tar.xz
          if-no-files-found: error
          retention-days: 7
          archive: false
          overwrite: true

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run formatting and tests
        shell: bash
        run: |
          set +e

          : > test.log

          echo '=== cargo fmt --check ===' >> test.log
          cargo fmt --all -- --check >> test.log 2>&1
          fmt_status=$?

          echo >> test.log
          echo '=== cargo test ===' >> test.log
          cargo test --features dev --no-fail-fast >> test.log 2>&1
          test_status=$?

          echo >> test.log
          echo "fmt_status=$fmt_status" >> test.log
          echo "test_status=$test_status" >> test.log

          if [ "$fmt_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            echo "fmt_status=$fmt_status"
            echo "test_status=$test_status"
            exit 1
          fi

      - name: Archive test log
        if: always()
        shell: bash
        run: |
          set +e
          tar caf test-log.tar.xz test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          path: test-log.tar.xz
          if-no-files-found: error
          retention-days: 7
          archive: false
          overwrite: true

