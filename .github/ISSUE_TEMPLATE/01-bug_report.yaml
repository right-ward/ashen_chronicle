name: 🐞 Bug Report
description: File a bug/issue in a prettier format
title: "[BUG] <title>"
labels: ["bug"]
assignees: ["right-ward"]
body:
- type: textarea
  attributes:
    label: Describe the Issue
    description: A concise description of what you're experiencing.
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps To Reproduce
    description: Steps to reproduce the behavior (if possible).
    placeholder: |
      1. In this environment...
      2. With this config...
      1. Run '...'
      4. See error...
  validations:
    required: false
- type: textarea
  attributes:
    label: Environment
    description: |
      examples:
        - **OS**: Ubuntu 20.04
        - **Version**: 0.37.2
    value: |
        - OS:
        - Version:
    render: markdown
  validations:
    required: true
