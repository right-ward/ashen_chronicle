name: 🐞 Bug Report
description: File a bug/issue in a prettier format
title: "[BUG] <title>"
labels: ["bug"]
assignees: ["right-ward"]
body:
- type: textarea
  attributes:
    label: Describe the Issue
    description: A concise description of what you're experiencing.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: A concise description of what you expected to happen.
  validations:
    required: false
- type: textarea
  attributes:
    label: Steps To Reproduce
    description: Steps to reproduce the behavior (if possible).
    placeholder: |
      1. In this environment...
      1. With this config...
      1. Run '...'
      1. See error...
  validations:
    required: false
- type: textarea
  attributes:
    label: Environment
    description: |
      examples:
        - **OS**: Ubuntu 20.04
        - **Version**: 0.37.2
    value: |
        - OS:
        - Version:
    render: markdown
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional Context
    description: |
      Links? References? Anything that will give us more context about the issue you are encountering!

      Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
