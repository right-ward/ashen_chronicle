[package]
name = "ashen_chronicle"

version = "0.50.4"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "2d_bevy_render",
    "ui_bevy_render",
    "std",
    "default_font",
    "bevy_winit",
    "x11",
    "android-game-activity",
] }
dirs = "6"
atomic-write-file = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1.1"

[features]
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 10
lto = true
opt-level = "s"
strip = true

[profile.test]
codegen-units = 256
opt-level = 1
debug = "line-tables-only"
