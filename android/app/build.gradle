plugins {
    alias(libs.plugins.android.application)
}

def androidAbi = System.getenv("ANDROID_ABI") ?: "arm64-v8a"
def androidVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "0.50.15"
def androidVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "5015001").toInteger()

def signingStoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = [
        signingStoreFile,
        signingStorePassword,
        signingKeyAlias,
        signingKeyPassword
].every { it != null && !it.isEmpty() }

android {
    namespace = "com.rightward.ashenchronicle"
    compileSdk = libs.versions.android.compileSdk.get().toInteger()

    defaultConfig {
        applicationId = "com.rightward.ashenchronicle"
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = libs.versions.android.targetSdk.get().toInteger()
        versionCode = androidVersionCode
        versionName = androidVersionName
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.create("release") {
                    storeFile = file(signingStoreFile)
                    storePassword = signingStorePassword
                    keyAlias = signingKeyAlias
                    keyPassword = signingKeyPassword
                }
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ["src/main/assets"]
            jniLibs.srcDirs += ["src/main/jniLibs/$androidAbi"]
        }
    }
}
