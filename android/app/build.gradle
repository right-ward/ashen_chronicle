plugins {
    alias(libs.plugins.android.application)
}

def androidAbi = System.getenv("ANDROID_ABI") ?: "arm64-v8a"
def androidVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "0.50.14"
def androidVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "5014001").toInteger()

def signingStoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = [
        signingStoreFile,
        signingStorePassword,
        signingKeyAlias,
        signingKeyPassword
].every { value -> value != null && !value.isEmpty() }

android {
    namespace 'com.rightward.ashenchronicle'
    compileSdk 34
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "com.rightward.ashenchronicle"
        minSdk 31
        targetSdk 33
        versionCode androidVersionCode
        versionName androidVersionName

        ndk {
            abiFilters androidAbi
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        prefab true
    }

    sourceSets {
        main {
            assets.srcDirs += files('../../data')
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.games.activity
    implementation libs.documentfile
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
